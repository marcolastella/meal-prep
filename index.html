<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Meal prep · 10 pasti in un’ora</title>
<meta name="description" content="Spesa, preparazione e pasti della settimana in un’unica app.">
<meta name="theme-color" content="#f3faf1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b1510" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Meal prep">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <h1>Meal prep</h1>
      <p class="sub" id="fridge">10 pasti in un’ora</p>
    </div>
    <button class="icon-btn sync" id="syncBtn" aria-label="Sincronizzazione e impostazioni"><span class="dot"></span><span class="sync-lbl" id="syncLbl">Locale</span></button>
  </header>

  <nav class="tabs" role="tablist" aria-label="Sezioni">
    <button role="tab" id="tab-0" aria-controls="p-0" data-page="0"><span class="tl">Spesa</span><span class="tc" id="tc-0"></span></button>
    <button role="tab" id="tab-1" aria-controls="p-1" data-page="1"><span class="tl">Prep</span><span class="tc" id="tc-1"></span></button>
    <button role="tab" id="tab-2" aria-controls="p-2" data-page="2"><span class="tl">Pasti</span><span class="tc" id="tc-2"></span></button>
    <span class="ind" id="ind"></span>
  </nav>

  <main class="pager" id="pager">
    <div class="strip" id="strip">
      <section class="page" id="p-0" role="tabpanel" aria-labelledby="tab-0"></section>
      <section class="page" id="p-1" role="tabpanel" aria-labelledby="tab-1"></section>
      <section class="page" id="p-2" role="tabpanel" aria-labelledby="tab-2"></section>
    </div>
  </main>
</div>

<div id="timers" aria-live="polite"></div>
<div id="toast" role="status" aria-live="polite"></div>

<div class="sheet" id="sheet" aria-hidden="true">
  <div class="sheet-bg" data-close></div>
  <div class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <div class="grab" id="grab"><span></span></div>
    <div class="sheet-body" id="sheetBody"></div>
  </div>
</div>

<div class="cook" id="cook" aria-hidden="true" role="dialog" aria-modal="true" aria-label="Modalità cucina"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
